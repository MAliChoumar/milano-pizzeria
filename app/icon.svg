<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f0d882"/>
      <stop offset="40%"  stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#8a6520"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="32" height="32" rx="7"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Outer gold ring -->
  <rect width="32" height="32" rx="7" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.35"/>

  <!-- "M" — italic serif, gold gradient, clipped to safe area -->
  <g clip-path="url(#round)">
    <text
      x="16" y="21.5"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="21"
      font-weight="700"
      font-style="italic"
      fill="url(#gold)"
      text-anchor="middle"
      letter-spacing="-0.5"
    >M</text>
  </g>

  <!-- Italian flag stripe — bottom, 3 equal segments -->
  <rect x="4"    y="26.5" width="7.33" height="2.5" rx="0" fill="#009246"/>
  <rect x="11.33" y="26.5" width="7.34" height="2.5"       fill="#F4F5F0"/>
  <rect x="18.67" y="26.5" width="7.33" height="2.5" rx="0" fill="#CE2B37"/>

  <!-- Thin separator above flag -->
  <rect x="4" y="26" width="24" height="0.4" fill="#c9a84c" opacity="0.3"/>
</svg>
