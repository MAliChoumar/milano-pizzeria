<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffe082"/>
      <stop offset="45%"  stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#a07820"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
  </defs>

  <!-- Background — slightly rounded -->
  <rect width="32" height="32" rx="5" fill="url(#bg)"/>

  <!-- Gold "M" — bold, large, high contrast, italic serif -->
  <!-- Rendered as stroked+filled path for maximum weight at 16px -->
  <text
    x="16" y="21"
    font-family="Georgia,'Times New Roman',serif"
    font-size="23"
    font-weight="900"
    font-style="italic"
    fill="url(#gold)"
    stroke="url(#gold)"
    stroke-width="0.6"
    text-anchor="middle"
    paint-order="stroke fill"
  >M</text>

  <!-- Italian flag — taller band, full width for visibility -->
  <rect x="3"    y="26" width="8.7"  height="3.5" fill="#009246"/>
  <rect x="11.7" y="26" width="8.6"  height="3.5" fill="#F5F5F0"/>
  <rect x="20.3" y="26" width="8.7"  height="3.5" fill="#CE2B37"/>

  <!-- Thin gold separator above flag -->
  <rect x="3" y="25.5" width="26" height="0.5" fill="#d4a017" opacity="0.5"/>
</svg>
